
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>American Dream Trader</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      /* Era-themed styling with CSS variables */
      body {
        font-family: var(--font-body, 'Inter', sans-serif);
        background-color: var(--color-background, #111827);
        color: var(--color-text, #f3f4f6);
        transition: background-color 0.5s ease, color 0.5s ease;
      }

      /* Themed scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: var(--color-surface, #1f2937);
      }
      ::-webkit-scrollbar-thumb {
        background: var(--color-border, #4b5563);
        border-radius: var(--radius-button, 4px);
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--color-surface-hover, #6b7280);
      }

      /* Smooth transitions for theme changes */
      * {
        transition-property: background-color, border-color, color;
        transition-duration: 0.3s;
        transition-timing-function: ease;
      }

      /* Prevent transition on initial load */
      .no-transition * {
        transition: none !important;
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Fonts for all three eras -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Orbitron:wght@400;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              gray: {
                750: '#273142', // A custom darker gray if needed
                850: '#171e2b'  // Another custom shade
              }
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              display: ['Orbitron', 'sans-serif'], // For titles or special text
            },
             animation: {
                fadeInScale: 'fadeInScale 0.3s forwards',
                marquee: 'marquee 40s linear infinite',
            },
            keyframes: {
                fadeInScale: {
                    '0%': { opacity: '0', transform: 'scale(0.95)' },
                    '100%': { opacity: '1', transform: 'scale(1)' },
                },
                marquee: {
                    '0%': { transform: 'translateX(0%)' },
                    '100%': { transform: 'translateX(-50%)' },
                },
            }
          }
        }
      }
    </script>
